<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concept 4: Isometric Crystal Core — Architectural Hex-Facet Gemstone -->
  <defs>
    <linearGradient id="iso-top" x1="16" y1="12" x2="48" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFD65C"/>
      <stop offset="100%" stop-color="#F5A313"/>
    </linearGradient>
    <linearGradient id="iso-right" x1="32" y1="32" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5A313"/>
      <stop offset="100%" stop-color="#A83800"/>
    </linearGradient>
    <linearGradient id="iso-left" x1="12" y1="48" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8730C"/>
      <stop offset="100%" stop-color="#FFA81F"/>
    </linearGradient>
    <radialGradient id="iso-glow" cx="32" cy="32" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5A313" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F5A313" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#iso-glow)"/>

  <!-- Primary Isometric Hexagon Faces -->
  <!-- Top Face (Key Light) -->
  <polygon points="32,9 51,20.5 32,32 13,20.5" fill="url(#iso-top)"/>
  <!-- Right Face (Deep Refraction) -->
  <polygon points="32,32 51,20.5 51,43.5 32,55" fill="url(#iso-right)"/>
  <!-- Left Face (Midtone Ember) -->
  <polygon points="13,20.5 32,32 32,55 13,43.5" fill="url(#iso-left)"/>

  <!-- Precision Internal Gem Cuts (Optical Bevels) -->
  <!-- Top Mirror Facet -->
  <polygon points="32,15 43,21.5 32,28 21,21.5" fill="#FFFFFF" opacity="0.6"/>

  <!-- Right Internal Bevel -->
  <polygon points="32,32 44,25 44,40 32,47" fill="#C74D00" opacity="0.6"/>

  <!-- Left Internal Bevel -->
  <polygon points="20,25 32,32 32,47 20,40" fill="#FFB326" opacity="0.4"/>

  <!-- Incandescent Central Star Intersection -->
  <polygon points="32,23 37.5,32 32,41 26.5,32" fill="#FFFFFF"/>
  <polygon points="23,32 32,36 41,32 32,28" fill="#FFF4CC"/>
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF"/>

  <!-- Structural Precision Outline & Edges -->
  <polygon points="32,9 51,20.5 51,43.5 32,55 13,43.5 13,20.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  <line x1="32" y1="9" x2="32" y2="32" stroke="#FFFFFF" stroke-width="1.25" opacity="0.9"/>
  <line x1="13" y1="20.5" x2="32" y2="32" stroke="#FFFFFF" stroke-width="1.25" opacity="0.9"/>
  <line x1="51" y1="20.5" x2="32" y2="32" stroke="#E8730C" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="32" x2="32" y2="55" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
</svg>