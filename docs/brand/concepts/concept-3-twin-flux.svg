<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concept 3: Twin Flux — Orbital Resonance Pair cradling a Diamond Core -->
  <defs>
    <linearGradient id="flux-alpha" x1="12" y1="10" x2="34" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FFE07D"/>
      <stop offset="55%" stop-color="#FF9E1A"/>
      <stop offset="100%" stop-color="#D95C00"/>
    </linearGradient>
    <linearGradient id="flux-beta" x1="52" y1="54" x2="30" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D95C00"/>
      <stop offset="45%" stop-color="#FF9E1A"/>
      <stop offset="80%" stop-color="#FFE07D"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="flux-glow" cx="32" cy="32" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5A313" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F5A313" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
