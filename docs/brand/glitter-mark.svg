<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Glitter Brand Mark: The Obsidian Monolith
       Precision chamfered dark titanium / obsidian crystal with incandescent molten plasma fissure. -->
  <defs>
    <!-- Left Main Facet: Space Titanium / Obsidian -->
    <linearGradient id="mono-body-left" x1="14" y1="7" x2="31" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A5A66"/>
      <stop offset="25%" stop-color="#363640"/>
      <stop offset="70%" stop-color="#202026"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>

    <!-- Right Main Facet: Smoky Obsidian -->
    <linearGradient id="mono-body-right" x1="33" y1="7" x2="50" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#463E36"/>
      <stop offset="30%" stop-color="#2D2520"/>
      <stop offset="75%" stop-color="#1E1714"/>
      <stop offset="100%" stop-color="#140F0D"/>
    </linearGradient>

    <!-- Inner Fissure Chamfer Left: Catches Hot Molten Glow -->
    <linearGradient id="fissure-bevel-left" x1="28" y1="7" x2="31" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA826"/>
      <stop offset="40%" stop-color="#FF7A00"/>
      <stop offset="70%" stop-color="#D94800"/>
      <stop offset="100%" stop-color="#8F2200"/>
    </linearGradient>

    <!-- Inner Fissure Chamfer Right: Catches Intense Amber Scatter -->
    <linearGradient id="fissure-bevel-right" x1="36" y1="7" x2="33" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFBD4D"/>
      <stop offset="40%" stop-color="#FF8A00"/>
      <stop offset="70%" stop-color="#E65500"/>
      <stop offset="100%" stop-color="#9E2800"/>
    </linearGradient>

    <!-- Incandescent Molten Golden Plasma Core -->
    <linearGradient id="plasma-core" x1="32" y1="7" x2="32" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="20%" stop-color="#FFD680"/>
      <stop offset="50%" stop-color="#FFA019"/>
      <stop offset="80%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#D94800"/>
    </linearGradient>

    <!-- Ambient Plasma Caustic Glow -->
    <radialGradient id="plasma-glow" cx="32" cy="32" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9E1A" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#FF6A00" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#FF3C00" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FF2A00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Plasma Caustic Atmosphere -->
  <circle cx="32" cy="32" r="26" fill="url(#plasma-glow)"/>

  <!-- Left Monolith Slab (Faceted Outer Chamfer) -->
  <polygon points="23,7 28,7 28,57 23,57 14,46 14,18" fill="url(#mono-body-left)"/>
  <!-- Left Fissure Bevel (Hot Reflected Lip) -->
  <polygon points="28,7 30.75,7 30.75,57 28,57" fill="url(#fissure-bevel-left)"/>

  <!-- Right Monolith Slab (Faceted Outer Chamfer) -->
  <polygon points="36,7 41,7 50,18 50,46 41,57 36,57" fill="url(#mono-body-right)"/>
  <!-- Right Fissure Bevel (Hot Reflected Lip) -->
  <polygon points="33.25,7 36,7 36,57 33.25,57" fill="url(#fissure-bevel-right)"/>

  <!-- Precision Specular Rim Chamfer Highlights -->
  <polyline points="14,46 14,18 23,7 28,7" stroke="#FFFFFF" stroke-width="0.85" stroke-linecap="round" opacity="0.65"/>
  <polyline points="50,46 50,18 41,7 36,7" stroke="#FFA834" stroke-width="0.75" stroke-linecap="round" opacity="0.55"/>
  <polyline points="23,57 14,46" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round" opacity="0.3"/>
  <polyline points="41,57 50,46" stroke="#FF7A00" stroke-width="0.7" stroke-linecap="round" opacity="0.35"/>

  <!-- Central Laser Fissure Plasma Beam -->
  <rect x="30.75" y="7" width="2.5" height="50" rx="1.25" fill="url(#plasma-core)"/>
  <rect x="31.25" y="12" width="1.5" height="40" fill="#FFFFFF" opacity="0.95"/>

  <!-- Center Plasma Focal Node (Hyper-Concentrated Spark) -->
  <circle cx="32" cy="32" r="5" fill="#FFA500" opacity="0.6"/>
  <polygon points="32,26 34.5,32 32,38 29.5,32" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="1.75" fill="#FFFFFF"/>
</svg>
