<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tile-dark" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C2C30"/>
      <stop offset="1" stop-color="#18181A"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#tile-dark)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>
  <g transform="translate(9 9) scale(0.75)">
  <!-- Glitter Prismatic Mark: Geometric 'G' encircling an illuminated
       4-point faceted diamond spark (Glitter Stella). Replaces legacy Muse Code 'M'. -->
  <defs>
    <linearGradient id="ember-dark" x1="6" y1="8" x2="58" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8730C"/>
      <stop offset="0.52" stop-color="#F5A313"/>
      <stop offset="1" stop-color="#FFD24A"/>
    </linearGradient>
    <linearGradient id="sheen-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark-light-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE585"/>
    </linearGradient>
    <linearGradient id="spark-dark-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5A313"/>
      <stop offset="1" stop-color="#D95C00"/>
    </linearGradient>
  </defs>

  <!-- G Contour Body: Stroked path with round caps & clean join -->
  <path d="M 46 18 A 20 20 0 1 0 52 32 L 34 32" stroke="url(#ember-dark)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sheen Overlay for G Body -->
  <path d="M 46 18 A 20 20 0 1 0 52 32 L 34 32" stroke="url(#sheen-dark)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4-Point Faceted Diamond Spark at Optical Center (31, 32) -->
  <!-- Top Facet (illuminated from above) -->
  <path d="M 31 16.5 L 34.8 28.5 L 31 32 L 27.2 28.5 Z" fill="url(#spark-light-dark)"/>
  <!-- Left Facet (specular refraction) -->
  <path d="M 31 32 L 27.2 28.5 L 16.5 32 L 27.2 35.5 Z" fill="url(#spark-light-dark)" opacity="0.9"/>
  <!-- Right Facet (golden warmth connecting to crossbar) -->
  <path d="M 31 32 L 34.8 28.5 L 43.5 32 L 34.8 35.5 Z" fill="url(#spark-dark-dark)" opacity="0.95"/>
  <!-- Bottom Facet (deep ember shadow) -->
  <path d="M 31 32 L 34.8 35.5 L 31 47.5 L 27.2 35.5 Z" fill="url(#spark-dark-dark)"/>
</g>
</svg>
