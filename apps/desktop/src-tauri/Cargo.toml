[package]
name = "glitter"
version = "0.1.0"
description = "Glitter, a desktop coding-agent app with its own agent harness"
authors = ["Glitter contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "glitter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# The crate defines no doctests, but `cargo test` still compiles one through
# rustdoc — pure overhead here, and load-flaky (intermittent E0463 "can't find
# crate" under concurrent builds) so the documented native test gate can fail
# with no code regression. Unit and integration tests still run.
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.11"

[dependencies]
# macos-private-api lets the webview stop drawing its own background, which the
# translucent sidebar needs to show the window's material (see DECISIONS.md).
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
which = "8"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSApplication", "NSHapticFeedback", "NSImage", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
tauri-plugin-single-instance = "2.4.1"


# What ships is the release build. Thin LTO lets the linker drop and inline across
# the tauri/wry/tokio crates, and stripping symbols removes tens of megabytes the
# OS would otherwise map at every launch. opt-level stays at the default (3), and
# panics keep unwinding so the redacting panic hook and per-thread recovery work.
[profile.release]
lto = "thin"
strip = true

# Production embeds the UI. `tauri dev` passes --no-default-features so it can
# still load the Vite server. A plain `cargo build --release` must not ship in
# dev mode or the window stays blank (it would wait for localhost:1420).
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# `tauri::test` (mock_app/MockRuntime) drives the native-shell e2e without a
# window server; the feature only lands in test builds.
tauri = { version = "2", features = ["test"] }
