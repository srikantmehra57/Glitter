      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmBR" cx="0.85" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#EA580C" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmTC" cx="0.6" cy="0" r="0.4">
